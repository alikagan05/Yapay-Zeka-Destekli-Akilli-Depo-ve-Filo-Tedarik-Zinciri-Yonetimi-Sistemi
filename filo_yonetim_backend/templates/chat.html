<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lojistik Asistanı</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; }

        .chat-container {
            max-width: 900px;
            margin: 20px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 18px;
            text-align: center;
        }

        .chat-header h2 { margin: 0; font-size: 22px; }
        .chat-header p { margin: 5px 0 0; opacity: 0.9; font-size: 14px; }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .user {
            background: #3498db;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai {
            background: #2ecc71;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 14px 24px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background: #34495e; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <h2>🤖 Akıllı Lojistik Asistanı</h2>
        <p>Depo, Stok, Filo ve Sevkiyat Konularında Size Yardımcı Olur</p>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message ai">
            Merhaba! Ben Akıllı Lojistik Asistanıyım.<br>
            Stok durumu, araç verimliliği, sevkiyat planlaması gibi konularda yardımcı olabilirim.<br><br>
            Ne sormak istersiniz?
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Örneğin: Bu ay kritik stok var mı? En verimli araç hangisi?">
        <button onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const messageText = input.value.trim();
            if (!messageText) return;

            addMessage(messageText, 'user');
            input.value = '';

            try {
                const response = await fetch('/api/ai/chat/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText })
                });

                const data = await response.json();
                addMessage(data.ai_response, 'ai');
            } catch (error) {
                addMessage("Bağlantı hatası oluştu. Lütfen tekrar deneyin.", 'ai');
            }
        }

        function addMessage(text, sender) {
            const messagesDiv = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Enter tuşu ile gönderme
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
