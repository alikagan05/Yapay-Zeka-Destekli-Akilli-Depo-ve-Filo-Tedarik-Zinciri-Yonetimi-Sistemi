# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line, check the build.gradle files in the project.

# When configured, Gradle will run in-process when possible.
# org.gradle.parallel=true

# AndroidX package structure to make it easier to discover and upgrade
# AndroidX dependencies. The property is optional; if not specified, the old
# style will be used.
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
